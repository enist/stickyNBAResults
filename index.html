<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=480"/>
<title>NBA Sonuçları</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:480px;height:800px;overflow:hidden;background:#fff;color:#000;font-family:'Barlow Condensed','Arial Narrow',sans-serif}

.screen{width:480px;height:800px;display:flex;flex-direction:column}

/* HEADER */
.header{background:#000;color:#fff;padding:9px 18px 8px;display:flex;align-items:baseline;justify-content:space-between;flex-shrink:0}
.title{font-size:30px;font-weight:800;letter-spacing:1px;line-height:1}
.title small{font-size:14px;font-weight:700;letter-spacing:3px;color:#aaa;margin-left:6px}
.date{font-size:22px;font-weight:800;letter-spacing:.5px;line-height:1}

/* GAME LIST */
.games{flex:1;display:flex;flex-direction:column;padding:0 18px;overflow:hidden}
.game{flex:1;max-height:110px;display:grid;grid-template-columns:1fr auto 34px auto 1fr;align-items:center;border-bottom:2px solid #000}
.game:last-child{border-bottom:none}
.team{line-height:1}
.team.home{text-align:right}
.abbr{font-size:var(--abbr);font-weight:800;letter-spacing:.5px}
.name{display:block;font-size:var(--name);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.score{font-size:var(--score);font-weight:800;min-width:2.1em;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.mid{text-align:center;font-size:15px;font-weight:700;letter-spacing:1px;line-height:1.2}
.mid .tag{display:inline-block;background:#000;color:#fff;padding:1px 4px;margin-top:3px;font-size:11px}
.lose{color:#555}
.lose .abbr,.lose.score{font-weight:500}

/* size steps by game count */
.games{--abbr:34px;--name:14px;--score:44px}
.games.mid-n{--abbr:30px;--name:12px;--score:38px}
.games.many{--abbr:28px;--name:0px;--score:34px}
.games.many .name{display:none}

/* EMPTY / ERROR */
.message{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 36px}
.message b{font-size:40px;font-weight:800;line-height:1.05}
.message span{font-size:17px;font-weight:700;color:#555;margin-top:12px;letter-spacing:.5px}

/* FOOTER */
.footer{background:#000;color:#aaa;padding:8px 18px;display:flex;justify-content:space-between;flex-shrink:0;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
</style>
</head>
<body>
<div class="screen">
  <div class="header">
    <div class="title">NBA<small>SONUÇLAR</small></div>
    <div class="date" id="date-main">—</div>
  </div>
  <div class="games" id="games">
    <div class="message"><b>Yükleniyor…</b></div>
  </div>
  <div class="footer">
    <span id="count"></span>
    <span id="updated"></span>
  </div>
</div>
<script>
// balldontlie API anahtarı. Buraya yazın ya da URL'de ?key=... olarak verin.
const API_KEY='';
const params=new URLSearchParams(location.search);
const key=params.get('key')||API_KEY;

// NBA maç tarihleri ABD Doğu saatine göredir; "dün" o saat dilimine göre hesaplanır.
function yesterdayET(){
  const now=new Date(Date.now()-86400000);
  return new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);
}
const date=params.get('date')||yesterdayET();

const DEMO=[
  {visitor_team:{abbreviation:'BOS',name:'Celtics'},home_team:{abbreviation:'NYK',name:'Knicks'},visitor_team_score:112,home_team_score:108,period:4,status_state:'final'},
  {visitor_team:{abbreviation:'GSW',name:'Warriors'},home_team:{abbreviation:'LAL',name:'Lakers'},visitor_team_score:121,home_team_score:124,period:5,status_state:'final'},
  {visitor_team:{abbreviation:'MIA',name:'Heat'},home_team:{abbreviation:'MIL',name:'Bucks'},visitor_team_score:99,home_team_score:117,period:4,status_state:'final'},
  {visitor_team:{abbreviation:'DEN',name:'Nuggets'},home_team:{abbreviation:'OKC',name:'Thunder'},visitor_team_score:130,home_team_score:126,period:6,status_state:'final'},
  {visitor_team:{abbreviation:'PHX',name:'Suns'},home_team:{abbreviation:'DAL',name:'Mavericks'},visitor_team_score:104,home_team_score:110,period:4,status_state:'final'},
  {visitor_team:{abbreviation:'SAS',name:'Spurs'},home_team:{abbreviation:'MIN',name:'Timberwolves'},visitor_team_score:0,home_team_score:0,period:0,status_state:'postponed'}
];

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderHeader(){
  const d=new Date(date+'T12:00:00');
  $('date-main').textContent=d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});  $('updated').textContent='Güncelleme '+new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
}

function message(title,sub){
  $('games').className='games';
  $('games').innerHTML='<div class="message"><b>'+esc(title)+'</b>'+(sub?'<span>'+esc(sub)+'</span>':'')+'</div>';
}

const STATE_TR={postponed:'ERTELENDİ',canceled:'İPTAL',suspended:'ASKIDA',delayed:'GECİKTİ',abandoned:'YARIDA',in_progress:'SÜRÜYOR',scheduled:'BAŞLAMADI',unknown:'—'};

function gameRow(g){
  const final=g.status_state==='final';
  const v=g.visitor_team,h=g.home_team;
  const vs=g.visitor_team_score,hs=g.home_team_score;
  const vCls=final&&vs<hs?' lose':'',hCls=final&&hs<vs?' lose':'';
  let mid='@';
  if(final&&g.period>4)mid+='<br><span class="tag">'+(g.period===5?'OT':(g.period-4)+'OT')+'</span>';
  if(!final)mid='<span class="tag">'+(STATE_TR[g.status_state]||esc(g.status))+'</span>';
  const score=(s,cls)=>'<div class="score'+cls+'">'+(final||g.status_state==='in_progress'?s:'')+'</div>';
  return '<div class="game" lang="en">'+
    '<div class="team'+vCls+'"><span class="abbr">'+esc(v.abbreviation)+'</span><span class="name">'+esc(v.name)+'</span></div>'+
    score(vs,vCls)+
    '<div class="mid">'+mid+'</div>'+
    score(hs,hCls)+
    '<div class="team home'+hCls+'"><span class="abbr">'+esc(h.abbreviation)+'</span><span class="name">'+esc(h.name)+'</span></div>'+
  '</div>';
}

function render(games){
  games.sort((a,b)=>String(a.datetime).localeCompare(String(b.datetime)));
  const done=games.filter(g=>g.status_state==='final').length;
  $('count').textContent=games.length?done+' / '+games.length+' maç tamamlandı':'';
  if(!games.length)return message('Dün maç yoktu','NBA takviminde bu tarihte oynanan maç bulunmuyor.');
  const el=$('games');
  el.className='games'+(games.length>10?' many':games.length>6?' mid-n':'');
  el.innerHTML=games.map(gameRow).join('');
}

async function load(){
  renderHeader();
  if(params.has('demo'))return render(DEMO);
  if(!key)return message('API anahtarı yok','index.html içindeki API_KEY alanını doldurun veya adrese ?key=… ekleyin.');
  try{
    const r=await fetch('https://api.balldontlie.io/nba/v1/games?per_page=100&dates[]='+date,{headers:{Authorization:key}});
    if(r.status===401)return message('Geçersiz anahtar','balldontlie API anahtarını kontrol edin.');
    if(r.status===429)return message('Çok fazla istek','Bir dakika sonra tekrar denenecek.');
    if(!r.ok)throw new Error('HTTP '+r.status);
    render((await r.json()).data||[]);
  }catch(e){
    message('Veri alınamadı',e.message);
  }
}
load();
</script>
</body>
</html>
